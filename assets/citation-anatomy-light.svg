<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="ttl">
<title id="ttl">Anatomy of a priorlog search hit: session title, harness, timestamp and role; the snippet with the matched words marked and a secret shown as [REDACTED:anthropic_key]; the cite (harness, session id, message number); and the source locator (transcript file and line range), which priorlog read --source opens to show the exact raw line, redacted.</title>
